<!-- Supabase email template used for both "Magic link" and "Confirm signup".
     {{ .Token }} is the 6-digit code the app asks for. -->
<div style="margin:0;padding:32px 16px;background:#6EC6FF;font-family:Helvetica,Arial,sans-serif;color:#000000">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border-radius:24px;padding:32px">
    <p style="margin:0;font-size:28px;font-weight:800;letter-spacing:-1px">voylo.</p>
    <p style="margin:24px 0 8px;font-size:17px;line-height:1.5">Voici ton code pour te connecter&nbsp;:</p>
    <p style="margin:0;display:inline-block;background:#C7FF00;padding:8px 16px;font-size:36px;font-weight:800;letter-spacing:8px">{{ .Token }}</p>
    <p style="margin:24px 0 0;font-size:15px;line-height:1.5;color:#4A5560">Il est valable une heure. Si tu n’as rien demandé, ignore simplement cet e-mail.</p>
    <p style="margin:24px 0 0;font-size:15px;line-height:1.5;color:#4A5560">Moins de blabla. Plus de voyages.</p>
  </div>
</div>
